<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="filter">
    <feTurbulence baseFrequency="0.1" />
    <feColorMatrix values="0 0 0 9 -5  0 0 0 9 -5  0 0 0 9 -5  0 0 0 0 1" />

    <feMorphology operator="dilate" radius="0.3" />

    <feComponentTransfer>
      <feFuncR type="linear" slope="1.5" intercept="-0.2" />
      <feFuncG type="linear" slope="1.5" intercept="-0.4" />
      <feFuncB type="linear" slope="1.5" intercept="0" />
    </feComponentTransfer>
  </filter>

  <rect width="100%" height="100%" filter="url(#filter)" />
</svg>
